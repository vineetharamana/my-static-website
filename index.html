<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My First Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f0f4f8;
            margin: 0;
            padding: 50px 20px;
        }

        .container {
            background: white;
            padding: 40px 20px;
            border-radius: 12px;
            max-width: 600px;
            margin: auto;
        }

        h1 {
            color: #1565c0;
        }

        p {
            color: #444;
            font-size: 18px;
        }

        a {
            display: inline-block;
            background: #1565c0;
            color: white;
            padding: 12px 20px;
            text-decoration: none;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to My Website!</h1>
        <p>Hello! I am learning DevOps and cloud technologies.</p>
        <p>This website is hosted using GitHub Pages.</p>
        <a href="https://github.com/">Visit GitHub</a>
    </div>
</body>
</html>
